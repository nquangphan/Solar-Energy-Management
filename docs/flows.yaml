# Manifest flow ↔ file (nguồn sự thật). Chuẩn: STANDARD.md của crew-docs.
# Các mục source, shared, unassigned được bảo vệ (luật R6): chỉ đổi khi chủ dự án cho phép.
#
# source = file viết tay mà mọi thay đổi phải đi kèm docs của flow (R2, R3).
# Không tính là nguồn: _bmad-output/** và docs/** (tài liệu), test (vẫn liệt kê ở `tests` của flow),
# file sinh tự động (OpenAPI, permissions.json, token/icon/permission key web + mobile: sửa nguồn rồi
# chạy generator), lockfile, font nhị phân, node_modules/dist/build.
version: 1
source:
  include:
    - "backend/src/**"
    - "backend/prisma/**"
    - "backend/scripts/**"
    - "backend/package.json"
    - "backend/tsconfig.json"
    - "backend/tsconfig.build.json"
    - "backend/nest-cli.json"
    - "backend/eslint.config.mjs"
    - "backend/.prettierrc"
    - "backend/prisma.config.ts"
    - "backend/.env.example"
    - "web/src/**"
    - "web/index.html"
    - "web/package.json"
    - "web/tsconfig.json"
    - "web/vite.config.ts"
    - "mobile/lib/**"
    - "mobile/pubspec.yaml"
    - "mobile/analysis_options.yaml"
    - "design-system/**"
    - ".github/workflows/ci.yml"
  exclude:
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/*.spec.ts"
    - "**/*.test.*"
    - "**/*_test.dart"
    - "web/src/test/**"
    - "**/*.g.dart"
    - "**/*.generated.ts"
    - "backend/openapi/**"
    - "web/src/design-system/tokens/tokens.ts"
    - "web/src/design-system/tokens/tokens.css"
    - "web/src/design-system/icons/sprite.ts"
    - "web/src/design-system/icons/icons.css"
    - "web/src/design-system/icons/Icon.tsx"
    - "mobile/lib/design_system/tokens/app_tokens.dart"
    - "mobile/lib/design_system/icons/app_icons.dart"
    - "**/*.ttf"
