# Minimal scaffold so the shared design tokens compile and test on Flutter
# (Story 1.1). The full mobile app package (Clean Architecture + BLoC) is set up
# by later stories (1.7 widgets, 1.8 app shell) on this same tree.
name: pns_mobile
description: "Phương Nam Solar — mobile (Flutter). Token layer scaffold."
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Renders the shared icon sprite as inline SVG strings with currentColor
  # (Story 1.2). Icon data is bundled in app_icons.dart — 0 network assets.
  flutter_svg: ^2.3.0
  # Behaviour layer (Story 1.7). The widgets only INVOKE these plugins to pick a
  # file / open the OS share sheet — they never upload (AD-3). Both are injected
  # in widget tests (no platform channel on the test VM).
  image_picker: ^1.1.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Static analysis floor (project-context requires analysis_options.yaml).
  flutter_lints: ^4.0.0

flutter:
