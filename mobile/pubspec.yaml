# Phương Nam Solar mobile app (Flutter): design-system widgets, screens, the
# HTTP client generated from backend/openapi/openapi.json (lib/api/generated,
# regenerate with `dart run tool/generate_api.dart`) and the app composition
# root lib/main.dart (Story 10.6).
name: pns_mobile
description: "Phương Nam Solar — mobile (Flutter)."
publish_to: none
version: 0.1.0

environment:
  # >= 3.8: json_serializable warns on an older language version.
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  # Renders the shared icon sprite as inline SVG strings with currentColor
  # (Story 1.2). Icon data is bundled in app_icons.dart — 0 network assets.
  flutter_svg: ^2.3.0
  # Behaviour layer (Story 1.7). The widgets only INVOKE these plugins to pick a
  # file / open the OS share sheet — they never upload (AD-3). Both are injected
  # in widget tests (no platform channel on the test VM).
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  # HTTP (Story 10.6): only lib/api/transport.dart builds a Dio; the generated
  # retrofit client runs on it.
  dio: ^5.11.1
  retrofit: ^4.10.0
  json_annotation: ^4.12.0
  # Refresh token at rest (Keystore / Keychain); the access token stays in memory.
  flutter_secure_storage: ^10.3.4
  # Signed-in navigation (Story 10.7). 17.2.3 is the last release for Flutter 3.35 /
  # Dart 3.9 (17.3+ needs Dart 3.10).
  go_router: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Static analysis floor (project-context requires analysis_options.yaml).
  flutter_lints: ^4.0.0
  # Client generator: swagger_parser writes the retrofit/json_serializable
  # sources, build_runner writes their .g.dart parts (tool/generate_api.dart).
  swagger_parser: ^1.45.0
  build_runner: ^2.15.1
  retrofit_generator: ^10.3.2
  json_serializable: ^6.14.1
  # Pin only: source_helper 1.4.0 clashes with json_serializable 6.14.1
  # (toStringNonNullable defined in two extensions ⇒ build script fails to
  # compile). Drop the pin once the SDK is >= 3.12 (json_serializable 6.15+).
  source_helper: 1.3.13

flutter:
