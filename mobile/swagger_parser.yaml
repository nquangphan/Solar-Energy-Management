# Client generator config (Story 10.6). Do not run swagger_parser directly:
# `dart run tool/generate_api.dart` first derives the spec read here from
# ../backend/openapi/openapi.json, then runs swagger_parser and build_runner.
swagger_parser:
  schema_path: .dart_tool/pns_api/openapi.mobile.json
  output_directory: lib/api/generated
  name: pns_api
  language: dart
  json_serializer: json_serializable
  root_client: true
  root_client_name: PnsApiClient
  export_file: true
  use_multipart_file: true
  mark_files_as_generated: true
