# build_runner only touches the generated client (Story 10.6; runs in
# tool/codegen/ since Story 11.1, where lib/ holds nothing else).
targets:
  $default:
    builders:
      json_serializable:
        generate_for: [lib/api/generated/**]
      retrofit_generator:
        generate_for: [lib/api/generated/**]
      source_gen:combining_builder:
        generate_for: [lib/api/generated/**]
